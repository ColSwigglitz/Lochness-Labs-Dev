<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080713"/><stop offset=".38" stop-color="#19112f"/><stop offset=".7" stop-color="#67316f"/><stop offset="1" stop-color="#e68bb0"/></linearGradient>
  <radialGradient id="sun" cx="73%" cy="35%" r="34%"><stop offset="0" stop-color="#ffd9d4" stop-opacity=".95"/><stop offset=".17" stop-color="#efa1cf" stop-opacity=".72"/><stop offset=".52" stop-color="#8f4ac7" stop-opacity=".28"/><stop offset="1" stop-color="#34134f" stop-opacity="0"/></radialGradient>
  <linearGradient id="mountainFar" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#44244f"/><stop offset="1" stop-color="#1b1629"/></linearGradient>
  <linearGradient id="mountainNear" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#171427"/><stop offset="1" stop-color="#080a13"/></linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#171326"/><stop offset=".35" stop-color="#0b0b16"/><stop offset="1" stop-color="#03040a"/></linearGradient>
  <linearGradient id="reflection" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f0a5cf" stop-opacity=".7"/><stop offset="1" stop-color="#7d4cce" stop-opacity="0"/></linearGradient>
  <linearGradient id="nessie" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#28273b"/><stop offset=".38" stop-color="#111621"/><stop offset="1" stop-color="#05070d"/></linearGradient>
  <linearGradient id="nessieLight" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#b26be0" stop-opacity=".8"/><stop offset=".4" stop-color="#7153bb" stop-opacity=".28"/><stop offset="1" stop-color="#1a2030" stop-opacity="0"/></linearGradient>
  <pattern id="scales" width="30" height="22" patternUnits="userSpaceOnUse"><path d="M0 11 Q7 1 15 11 Q23 1 30 11" fill="none" stroke="#7b6b9f" stroke-opacity=".19" stroke-width="1.7"/><path d="M0 22 Q7 12 15 22 Q23 12 30 22" fill="none" stroke="#3f4765" stroke-opacity=".26" stroke-width="1.4"/></pattern>
  <filter id="mist"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
