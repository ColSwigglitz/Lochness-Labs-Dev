      <stop offset="1" stop-color="#020104"/>
    </linearGradient>
    <linearGradient id="nessie" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#08060d"/>
      <stop offset="0.52" stop-color="#171020"/>
      <stop offset="0.78" stop-color="#35204d"/>
      <stop offset="1" stop-color="#0a0710"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
