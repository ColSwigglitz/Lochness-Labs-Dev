<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13071f"/>
      <stop offset="0.45" stop-color="#2b1245"/>
      <stop offset="1" stop-color="#07040b"/>
    </linearGradient>
    <radialGradient id="storm" cx="72%" cy="24%" r="48%">
      <stop offset="0" stop-color="#bb7cff" stop-opacity="0.65"/>
      <stop offset="0.35" stop-color="#7c3aed" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#13071f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
